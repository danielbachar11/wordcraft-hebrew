name: Build Windows MSI

on:
  push:
    branches: [ "main" ]

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p wordcraft

      - name: Install cargo-wix
        run: cargo install cargo-wix --version "^0.3" --locked

      - name: Initialize WiX configuration
        run: cargo wix init -p wordcraft

      - name: Build MSI installer
        run: cargo wix --no-build --nocapture -p wordcraft

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-windows-msi
          path: target/wix/*.msi
          if-no-files-found: error